[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coldchain-medbot-physical-ai"
version = "1.0.0"
description = "Autonomous Warehouse AMR & Biopharma Cold-Chain Physical AI Multi-Agent Supervisor on AWS Bedrock, IoT Core, TwinMaker, and Step Functions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Samuel K. Quansah", email = "samuelquansah@hotmail.com" }
]
keywords = [
    "physical-ai",
    "amazon-bedrock",
    "anthropic-claude",
    "multi-agent-orchestration",
    "autonomous-mobile-robots",
    "aws-iot-twinmaker",
    "rag-pipeline",
    "cold-chain",
]
dependencies = [
    "boto3>=1.34.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
coldchain-medbot = "coldchain_medbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
